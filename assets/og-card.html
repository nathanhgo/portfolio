<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:600;font-display:block;src:url('fontes/fraunces-600.woff2') format('woff2')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:block;src:url('fontes/jetbrains-mono-400.woff2') format('woff2')}
  @font-face{font-family:'Source Sans 3';font-style:normal;font-weight:400;font-display:block;src:url('fontes/source-sans-3-400.woff2') format('woff2')}
  @font-face{font-family:'Source Sans 3';font-style:normal;font-weight:600;font-display:block;src:url('fontes/source-sans-3-600.woff2') format('woff2')}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;box-sizing:border-box}
  *{box-sizing:border-box}
  body{font-family:"Source Sans 3",sans-serif;background:#10382e;color:#eef4f0;display:flex;flex-direction:column;justify-content:space-between;padding:60px 72px}
  .topo{font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:#9ad9bd}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:96px;line-height:1;margin:18px 0 0;letter-spacing:-.02em}
  p{font-size:32px;line-height:1.35;max-width:840px;margin:22px 0 0;color:#cfe3da}
  .rodape{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(238,244,240,.28);padding-top:26px;
    font-family:"JetBrains Mono",monospace;font-size:23px;letter-spacing:.08em;color:#9ad9bd}
  .bolinha{width:20px;height:20px;border-radius:50%;background:#6cc4a1;margin-right:14px;display:inline-block;vertical-align:middle}
</style></head><body>
  <div>
    <div class="topo">desenvolvedor de software</div>
    <h1>Nathan Guimarães</h1>
    <p>Páginas que trazem contato, automação de tarefas repetitivas e aplicações web e mobile.</p>
  </div>
  <div class="rodape"><span><span class="bolinha"></span>nathanguimaraes.com.br</span><span>Jacareí · SP · Brasil</span></div>
</body></html>
